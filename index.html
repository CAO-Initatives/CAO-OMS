<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAO OMS Sign In</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#111827;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:28px;box-shadow:0 16px 36px rgba(15,23,42,.10)}h1{margin:0 0 8px;font-size:24px;color:#0f172a}p{margin:0 0 18px;font-size:14px;color:#475569;line-height:1.5}label{display:block;font-size:12px;font-weight:700;color:#64748b;margin:13px 0 7px;text-transform:uppercase;letter-spacing:.04em}input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#1f5fb8;box-shadow:0 0 0 3px rgba(31,95,184,.12)}button{width:100%;border:0;border-radius:10px;padding:12px 14px;margin-top:16px;background:#1f5fb8;color:#fff;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.foot{margin-top:16px;font-size:12px;color:#64748b}
</style>
</head>
<body>
<main class="card">
<h1>CAO OMS Sign In</h1>
<p>Use your individual OMS credentials. OMS credentials are separate from GitHub credentials.</p>
<form id="loginForm">
<label for="userId">OMS User ID</label><input id="userId" autocomplete="username" required>
<label for="password">OMS Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="signIn" type="submit">Sign In</button>
</form>
<div id="error" class="msg error" role="alert"></div><div id="success" class="msg success" role="status"></div>
<div class="foot">Passwords are not stored in this browser. Closing the tab clears the temporary session.</div>
</main>
<script>
(()=>{
 const GATEWAY='https://cao-oms-gateway.vercel.app';
 const TOKEN_KEY='cao_oms_session'; const USER_KEY='cao_oms_user';
 const form=document.getElementById('loginForm'),btn=document.getElementById('signIn'),pw=document.getElementById('password'),err=document.getElementById('error'),ok=document.getElementById('success');
 const message=(el,text)=>{err.style.display='none';ok.style.display='none';el.textContent=text;el.style.display='block'};
 async function validateExisting(){const token=sessionStorage.getItem(TOKEN_KEY);if(!token)return;try{const r=await fetch(GATEWAY+'/api/state',{headers:{Authorization:'Bearer '+token}});if(r.ok){location.replace('./oms.html');return}}catch(e){}sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(USER_KEY)}
 form.addEventListener('submit',async e=>{e.preventDefault();err.style.display=ok.style.display='none';btn.disabled=true;btn.textContent='Signing in...';try{const r=await fetch(GATEWAY+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('userId').value.trim(),password:pw.value})});const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error('The sign-in service returned an unexpected response.')}if(!r.ok||!data.token)throw new Error(r.status===401?'Incorrect credentials.':'Sign-in service unavailable.');sessionStorage.setItem(TOKEN_KEY,data.token);sessionStorage.setItem(USER_KEY,JSON.stringify(data.user||{}));pw.value='';message(ok,'Access granted. Opening OMS...');location.replace('./oms.html')}catch(ex){pw.value='';message(err,ex.message||'Sign-in failed.');pw.focus()}finally{btn.disabled=false;btn.textContent='Sign In'}});
 validateExisting();
})();
</script>
</body>
</html>
